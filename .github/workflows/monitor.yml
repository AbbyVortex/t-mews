name: T-MEWS monitor
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation (send the one-time test before monitoring)
        type: choice
        options: [check, test, monitor]
        default: check
        required: true
  schedule:
    - cron: '2-57/5 * * * *'
permissions:
  contents: write
concurrency:
  group: t-mews-runtime
  cancel-in-progress: false
jobs:
  monitor:
    if: >-
      github.event.repository.private == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.T_MEWS_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run monitor with durable pre-send checkpoint
        run: pnpm actions:run "$OPERATION"
        env:
          OPERATION: ${{ inputs.operation || 'monitor' }}
          GITHUB_TOKEN: ${{ github.token }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
